<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Produk UMKM</title>
  <meta name="description" content="Katalog online UMKM — pesan langsung via WhatsApp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-zinc-50 font-sans text-zinc-800 antialiased">
  <!-- Top Bar Identitas Toko -->
  <div class="bg-purple-950 text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 text-sm">
      <span id="namaToko" class="min-w-0 truncate font-semibold">MyToko</span>
      <div class="flex shrink-0 items-center gap-5">
        <button
          type="button"
          id="btnLokasi"
          class="inline-flex items-center gap-1.5 text-purple-200 transition-colors hover:text-white"
          aria-label="Lokasi Toko"
        >
          <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          <span class="hidden sm:inline">Lokasi Toko</span>
        </button>
        <a
          id="waToko"
          class="inline-flex items-center gap-1.5 text-purple-200 transition-colors hover:text-white"
          href="https://wa.me/6281234567890"
          target="_blank"
          rel="noopener"
          aria-label="Hubungi via WhatsApp"
        >
          <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.06-1.32A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.12l-.3-.18-3 .78.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.36-6.06c-.24-.12-1.41-.7-1.63-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06a6.6 6.6 0 0 1-1.92-1.19 7.2 7.2 0 0 1-1.33-1.65c-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46a.88.88 0 0 0-.64.3 2.68 2.68 0 0 0-.84 2c0 1.18.86 2.32.98 2.48.12.16 1.7 2.6 4.12 3.64a13.8 13.8 0 0 0 1.37.51 3.3 3.3 0 0 0 1.51.09c.46-.09 1.41-.58 1.61-1.13.2-.56.2-1.03.14-1.13-.06-.1-.22-.16-.46-.28Z"/></svg>
          <span id="waTokoText" class="shrink-0 text-xs sm:text-sm">+6281234567890</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Hero Header -->
  <header class="mx-auto max-w-6xl px-4 pt-10 pb-8 text-center">
    <h1 id="judulHero" class="font-display text-3xl font-semibold tracking-tight text-purple-950 sm:text-4xl">
      Produk Katalog
    </h1>
    <p class="mt-3 text-sm font-light text-zinc-500 sm:text-base">
      Dibuat dengan bahan pilihan, langsung dari dapur kami
    </p>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-20">
    <!-- Bilah Kategori (geser horizontal ramah jempol) -->
    <nav class="scrollbar-none -mx-4 flex gap-3 overflow-x-auto px-4 pb-2 pt-1" aria-label="Filter Kategori">
      <div id="kategoriList" class="flex gap-3"></div>
    </nav>

    <!-- Pencarian & Pengurutan -->
    <div class="mb-8 mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
      <div class="relative flex-1">
        <svg
          class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="search"
          id="inputCari"
          placeholder="Cari jajanan favoritmu..."
          autocomplete="off"
          aria-label="Cari produk"
          class="w-full rounded-xl border border-zinc-200 bg-white py-2.5 pl-10 pr-4 text-sm text-zinc-800 transition placeholder:text-zinc-400 focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30"
        />
      </div>
      <select
        id="urutHarga"
        aria-label="Urutkan berdasarkan harga"
        class="cursor-pointer rounded-xl border border-zinc-200 bg-white px-3.5 py-2.5 text-sm text-zinc-700 transition focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30"
      >
        <option value="default">Urutkan: Default</option>
        <option value="termurah">Harga: Termurah → Termahal</option>
        <option value="termahal">Harga: Termahal → Termurah</option>
      </select>
    </div>

    <!-- Grid Produk -->
    <section
      id="produkGrid"
      class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4"
      aria-live="polite"
    ></section>
  </main>

  <!-- Modal Lokasi Toko -->
  <div
    id="modal-lokasi"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-purple-950/40 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <div class="modal-overlay absolute inset-0"></div>
    <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
      <h2 id="modalTitle" class="font-display text-center text-xl font-semibold text-zinc-900">
        Lokasi Toko
      </h2>
      <img
        id="modalFoto"
        class="my-4 aspect-video w-full rounded-xl bg-zinc-100 object-cover"
        alt="Foto Toko"
        src="images/uploads/default-store.jpg"
      />
      <p id="modalAlamat" class="mb-5 text-sm leading-relaxed text-zinc-600"></p>
      <button
        type="button"
        id="modalTutup"
        class="w-full rounded-xl bg-purple-950 py-3 text-sm font-semibold text-white transition-all duration-300 hover:bg-purple-800 active:scale-95"
      >
        Tutup
      </button>
    </div>
  </div>

  <!-- Tombol Scroll ke Atas -->
  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll ke atas">↑</button>

  <script src="app.js"></script>
</body>
</html>
